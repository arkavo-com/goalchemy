name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Core compiler, suite: core}
          - {name: Language and corpus (Go), suite: language, target: go}
          - {name: Language and corpus (TypeScript), suite: language, target: typescript}
          - {name: Language and corpus (Python), suite: language, target: python}
          - {name: Language and corpus (Java), suite: language, target: java}
          - {name: Language and corpus (C#), suite: language, target: csharp}
          - {name: Language and corpus (Rust), suite: language, target: rust}
          - {name: Language and corpus (C), suite: language, target: c}
          - {name: Language and corpus (Swift), suite: language, target: swift}
          - {name: Native contracts and browser, suite: contracts}
          - {name: HTTP contracts all targets, suite: contracts, shard: 1}
          - {name: Integration 1 of 4, suite: integration, shard: 0}
          - {name: Integration 2 of 4, suite: integration, shard: 1}
          - {name: Integration 3 of 4, suite: integration, shard: 2}
          - {name: Integration 4 of 4, suite: integration, shard: 3}
          - {name: Examples and reproducible output all targets, suite: examples}
          - {name: Memory and sanitizers, suite: memory}
          - {name: Float differential all targets, suite: floats}
          - {name: Naming modes all targets, suite: naming}
          - {name: Runtime conformance all targets, suite: runtime}
          - {name: Native pause model, suite: pause}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ci/browser-tooling/package-lock.json
            targets/typescript/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgc-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libedit2 libxml2 perl ripgrep
      - name: Cache pinned toolchain downloads
        uses: actions/cache@v5
        with:
          path: .toolchains/downloads
          key: ${{ runner.os }}-native-tools-${{ hashFiles('toolchains.lock') }}
      - name: Cache locked Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('targets/rust/tests/harness/Cargo.lock') }}
      - name: Cache pinned Playwright browsers
        uses: actions/cache@v5
        with:
          path: .toolchains/playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('ci/browser-tooling/package-lock.json') }}
      - name: Cache pinned Java dependencies
        uses: actions/cache@v5
        with:
          path: out/java-dependencies
          key: ${{ runner.os }}-java-dependencies-${{ hashFiles('targets/java/dependencies.lock.json') }}
      - name: Prepare pinned native and browser test dependencies
        run: bash scripts/ci-bootstrap.sh --with-browser-deps
      - name: Run selected checks
        run: python3 scripts/ci-suite.py '${{ matrix.suite }}' --shard '${{ matrix.shard || 0 }}' --target '${{ matrix.target || '' }}'

  # Preserve the existing required check name and fail if any shard fails or skips.
  test:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
