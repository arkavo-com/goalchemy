schema_version: 1
target: java
version: 0.1.0
status: experimental
environment:
  runtime: OpenJDK
  minimum: "Java 21"
  build: "javac -d classes $(find . -name '*.java') && java -Xss512m -cp classes Main"
  native: "JDK 21 JCA providers plus the pinned Bouncy Castle 1.86 jar (bcprov-jdk18on, locked in targets/java/dependencies.lock.json) for HKDF and EC private key imports, which derive the public point; HTTP uses java.net.http; IEEE CRC32 uses standard java.util.zip.CRC32 and host-controlled acceleration."
representations:
  - {type: type.float, contract_version: 1.0.0, representation: "Native float/double with explicit numeric unboxing and key normalization."}
  - {type: type.boolean, contract_version: 1.0.0, representation: Java boolean.}
  - {type: type.integer, contract_version: 1.0.0, representation: "Java long for every integer kind, normalized to the Go width after every operation; unsigned 64-bit values keep their bits and use unsigned comparison, division, and formatting (types/Ints.java)."}
  - {type: type.string, contract_version: 1.0.0, representation: "Java String holding one char per byte (ISO-8859-1), so indexing and length are bytewise."}
  - {type: type.array, contract_version: 1.0.0, representation: "Native byte[] for uint8 elements, Object[] otherwise, with generated zero, clone, in-place set, equality, and key helpers per array type."}
  - {type: type.struct, contract_version: 1.0.0, representation: "One generated class per struct type with $clone, $set, $eq, and $key; storage objects are updated in place, so field pointers stay valid."}
  - {type: type.slice, contract_version: 1.0.0, representation: "Immutable Slice headers (a, o, l, c) over shared native byte[] or Object[] arrays (types/Slice.java); BYTE_NIL retains the byte hint for nil slices."}
  - {type: type.map, contract_version: 1.0.0, representation: "GoMap: a HashMap from encoded keys to entries plus an insertion-ordered entry list (types/GoMap.java); nil is null."}
  - {type: type.pointer, contract_version: 1.0.0, representation: "Pointers to structs and arrays are the objects themselves; other pointers are Cell or canonical field Ref objects (types/Ref.java); nil is null."}
  - {type: type.interface, contract_version: 1.0.0, representation: "null or a Box (t, v) with per-type equality, key encoding, and method tables (types/Box.java, types/TypeDesc.java)."}
  - {type: type.function, contract_version: 1.0.0, representation: "Fn objects with boxed arguments, tagged with an identity for recover; nil is null."}
  - {type: type.error, contract_version: 1.0.0, representation: "Interface Boxes; runtime errors use the RUNTIME_ERROR, PLAIN_ERROR, and TYPE_ASSERTION_ERROR descriptors (types/Panics.java)."}
  - {type: type.channel, contract_version: 1.0.0, representation: "Chan objects with a buffer and FIFO wait queues (runtime/ChanMake.java); null is the nil channel."}
  - {type: type.task, contract_version: 1.0.0, representation: "A stack of resumable frames per task driven by a trampoline (runtime/TaskSpawn.java): suspending functions compile to Frame subclasses with a step method; exactly one task runs at a time, dispatched FIFO. Default entry retains virtual time; explicit serialized runMainHost uses System.nanoTime, owner mailbox completions, cleanup acknowledgement and retirement."}
harness:
  support: [tests/harness/Harness.java, tests/harness/Codec.java, tests/harness/Json.java, tests/harness/run.sh]
  generated: tests/harness/HarnessGen.java
  command: [sh, targets/java/tests/harness/run.sh]
support_files: [types/Floats.java, types/Bounds.java, types/Box.java, types/Cell.java, types/Fn.java, types/GoMap.java, types/GoPanic.java, types/Ints.java, types/Out.java, types/Panics.java, types/Program.java, types/Ref.java, types/Slice.java, types/TypeDesc.java, types/Utf8.java, types/Native.java, types/Crypto.java, types/Der.java, types/Callback.java, types/Log.java, runtime/Library.java, runtime/StdErrorsNew.java, runtime/StdContextWithCancel.java, runtime/TaskSpawn.java, runtime/StdContextErr.java, runtime/ChanMake.java, runtime/ChanClose.java]
