[package]
name = "goalchemy-rust-harness"
version = "0.1.0"
edition = "2021"
[features]
default = ["native"]
native = []
[dependencies]
crc32fast = "=1.5.2"
openssl = { version = "=0.10.81", features = ["vendored"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
flate2 = "=1.1.10"
http-body = "=1.1.0"
bytes = "=1.12.1"
tokio = { version = "=1.53.1", features = ["rt", "time", "sync", "macros"] }
base64 = "=0.22.1"
[[bin]]
name = "harness"
path = "main.rs"
