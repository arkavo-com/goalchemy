schema_version: 1
target: typescript
version: 0.1.0
status: experimental
environment:
  runtime: Node.js executable with TypeScript type stripping; portable Promise cooperative entry for Node/browser
  minimum: Node.js 22.6 (ES2022)
  build: node main.ts
  native: "No npm runtime dependencies: WebCrypto (crypto.subtle) for crypto and fetch for HTTP in Node.js or browsers; IEEE CRC32 uses node:zlib.crc32 in Node executable/package entries and a slicing-by-8 fallback in browsers and the portable main entry. Host runtime controls acceleration."
representations:
  - {type: type.float, contract_version: 1.0.0, representation: "JavaScript number with explicit binary32 rounding, exact BigInt conversions and nonreflexive NaN key encodings."}
  - {type: type.channel, contract_version: 1.0.0, representation: "Chan objects with a buffer and FIFO wait queues (runtime/chan_make.ts); null is the nil channel."}
  - {type: type.task, contract_version: 1.0.0, representation: "Resumable frame stacks dispatched FIFO by runtime/task_spawn.ts; synchronous executable/conformance entry uses virtual time, explicit Promise host entry uses owner-local real monotonic time, mailbox completions and cleanup acknowledgement. Global executable binding rejects overlapping entries; isolated library exports remain gated."}
  - {type: type.boolean, contract_version: 1.0.0, representation: JavaScript boolean.}
  - {type: type.integer, contract_version: 1.0.0, representation: "8-, 16-, and 32-bit kinds are numbers kept in range by explicit wrapping; int, uint, int64, and uint64 are BigInt values normalized with BigInt.asIntN/asUintN (types/integer.ts)."}
  - {type: type.string, contract_version: 1.0.0, representation: "Binary JavaScript strings holding one byte per UTF-16 code unit; comparison and concatenation are bytewise."}
  - {type: type.array, contract_version: 1.0.0, representation: "Uint8Array for uint8-underlying elements; JavaScript arrays otherwise, with generated zero, clone, in-place set, equality, and key helpers per array type."}
  - {type: type.struct, contract_version: 1.0.0, representation: "One generated class per struct type; variables and fields of struct type are stable objects updated in place by $set, so field pointers stay valid."}
  - {type: type.slice, contract_version: 1.0.0, representation: "Immutable Slice headers {a, o, l, c, bytes} over shared Uint8Array for uint8-underlying elements and JavaScript arrays otherwise (types/slice.ts); rt.BYTE_NIL and rt.NIL preserve nil byte and generic storage hints."}
  - {type: type.map, contract_version: 1.0.0, representation: "GoMap: a host Map from encoded keys to entries plus an insertion-ordered entry list for snapshot iteration (types/map.ts); nil is null."}
  - {type: type.pointer, contract_version: 1.0.0, representation: "Pointers to structs and arrays are the objects themselves; other pointers are Cell or canonical FieldRef objects with a v accessor (types/ref.ts); nil is null."}
  - {type: type.interface, contract_version: 1.0.0, representation: "null or a Box {t: TypeDesc, v} with per-type equality, key encoding, and method tables (types/iface.ts)."}
  - {type: type.function, contract_version: 1.0.0, representation: "JavaScript functions tagged with $fid for recover identity; closures capture cells; nil is null."}
  - {type: type.error, contract_version: 1.0.0, representation: "Interface Boxes; runtime errors use the RUNTIME_ERROR, PLAIN_ERROR, and TYPE_ASSERTION_ERROR descriptors (types/panic.ts)."}
harness:
  support: [tests/harness/harness.ts, tests/harness/codec.ts, tests/harness/runtime_index.ts]
  generated: tests/harness/harness_gen.ts
  command: [node, targets/typescript/tests/harness/harness.ts]
support_files: [types/float.ts, types/integer.ts, types/panic.ts, types/iface.ts, types/ref.ts, types/slice.ts, types/map.ts, types/print.ts, types/bounds.ts, types/utf8.ts, types/program.ts, types/host.ts, types/node_host.ts, types/node_checksum.ts, types/node_zlib.d.ts, types/files.ts, types/node_fs.ts, types/node_files.d.ts, types/http.ts, types/node_http.ts, types/node_net.d.ts, types/native.ts, types/der.ts, types/crypto.ts, types/callback.ts, types/log.ts, runtime/std_errors_new.ts]
