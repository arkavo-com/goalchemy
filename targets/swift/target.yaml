schema_version: 1
target: swift
version: 0.1.0
status: experimental
environment:
  runtime: Swift
  minimum: Swift 6.4.0 on Linux x86_64
  build: sh run.sh (Swift compiler and a native C shim)
  native: OpenSSL 3 libcrypto, zlib CRC32, and libcurl HTTP via a C module. All current output packages
    include these native prerequisites.
representations:
- type: type.float
  contract_version: 1.0.0
  representation: Swift Float/Double with explicit binary32 boundaries, exact integer conversions, IEEE
    comparisons and Go shortest printing.
- type: type.boolean
  contract_version: 1.0.0
  representation: Swift Bool in a tagged runtime value.
- type: type.integer
  contract_version: 1.0.0
  representation: UInt64 bit patterns with explicit source width and signedness; arithmetic wraps and
    signed division truncates toward zero.
- type: type.string
  contract_version: 1.0.0
  representation: Immutable native [UInt8] preserving arbitrary Go string bytes.
- type: type.array
  contract_version: 1.0.0
  representation: Reference-backed fixed aggregate storage with recursive explicit value copies; uint8
    arrays use native [UInt8].
- type: type.struct
  contract_version: 1.0.0
  representation: Stable field cells in reference-backed aggregates; assignment copies recursively in
    place so field pointer identity survives.
- type: type.slice
  contract_version: 1.0.0
  representation: Swift value header over shared buffer, offset, length and capacity; uint8 buffers use
    [UInt8], nil and empty remain distinct.
- type: type.map
  contract_version: 1.0.0
  representation: Insertion-ordered entry objects with explicit Go equality, nil behavior, iterator entry
    snapshots, aggregate keys and NaN nonreflexivity.
- type: type.pointer
  contract_version: 1.0.0
  representation: Stable GCell identity and strong source edges, with explicit tracing cycle collection
    at scheduler safepoints.
- type: type.interface
  contract_version: 1.0.0
  representation: Dynamic source type descriptor and copied payload; methods, typed nil, assertions and
    comparability preserved.
- type: type.function
  contract_version: 1.0.0
  representation: GFunction captures stable cells and produces stack-safe resumable frames; nil calls
    panic.
- type: type.error
  contract_version: 1.0.0
  representation: Ordinary interface values, preserving custom source methods; host boundary exposes GoalchemyFailure
    and public field copies.
- type: type.channel
  contract_version: 1.0.0
  representation: GChannel FIFO queues, buffering, rendezvous and shared select registration.
- type: type.task
  contract_version: 1.0.0
  representation: Owner-controlled FIFO stack of resumable frames; virtual timers by default, explicit
    host entries wait for immutable native mailbox completions and cleanup acknowledgements.
support_files:
- types/Async.swift
- types/Channels.swift
- types/Collections.swift
- types/Files.swift
- types/Crypto.swift
- types/HTTP.swift
- types/Library.swift
- types/Log.swift
- types/Native.swift
- types/Numeric.swift
- types/Program.swift
- types/Value.swift
- native/GoalchemyNative.h
- native/GoalchemyNative.c
- native/module.modulemap
