schema_version: 1
target: go
version: 0.1.0
status: experimental
environment:
  runtime: Go 1.27.1 reference toolchain
  minimum: go1.25
  build: go build
  native: "Go standard library only: crypto/* for crypto, net/http for HTTP, and hash/crc32.ChecksumIEEE for IEEE CRC32; host runtime controls acceleration."
representations:
  - {type: type.float, contract_version: 1.0.0, representation: "Native Go float32/float64; each arithmetic result has an explicit conversion rounding barrier."}
  - {type: type.channel, contract_version: 1.0.0, representation: "rt.Chan[T] (runtime/chan_make.go): a handle to shared channel state with FIFO wait queues; the zero handle is the nil channel."}
  - {type: type.task, contract_version: 1.0.0, representation: "A stack of resumable frames per task driven by a trampoline (runtime/task_spawn.go): suspending functions compile to frame structs with a Step method; exactly one task runs at a time, dispatched FIFO."}
  - {type: type.boolean, contract_version: 1.0.0, representation: Go bool.}
  - {type: type.integer, contract_version: 1.0.0, representation: "Native Go integer types; int and uint are 64-bit on the linux/amd64 source profile and Go operators have identical semantics."}
  - {type: type.string, contract_version: 1.0.0, representation: Native Go string.}
  - {type: type.array, contract_version: 1.0.0, representation: Native Go arrays.}
  - {type: type.struct, contract_version: 1.0.0, representation: "Native Go structs; embedded fields keep native embedding for method promotion."}
  - {type: type.slice, contract_version: 1.0.0, representation: "Native Go slices; append goes through rt.Append for the selected growth rule."}
  - {type: type.map, contract_version: 1.0.0, representation: "rt.Map[K, V] (runtime/type_map.go), a handle to insertion-ordered storage over a native index; the zero handle is the nil map."}
  - {type: type.pointer, contract_version: 1.0.0, representation: Native Go pointers.}
  - {type: type.interface, contract_version: 1.0.0, representation: "Native Go interfaces; unexported method names carry a package suffix."}
  - {type: type.function, contract_version: 1.0.0, representation: Native Go function values and literals.}
  - {type: type.error, contract_version: 1.0.0, representation: "Native error; runtime errors use rt.RuntimeError, rt.PlainError, and rt.TypeAssertionError."}
harness:
  support: [tests/harness/harness.go]
  generated: tests/harness/harness_gen.go
  command: [go, run, ./targets/go/tests/harness]
support_files: [runtime/type_float.go, runtime/rt.go, runtime/panic.go, runtime/type_integer.go, runtime/type_map.go]
