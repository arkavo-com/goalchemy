schema_version: 1
target: c
version: 0.1.0
status: experimental
environment:
  runtime: C17 with the Boehm-Demers-Weiser collector (bdwgc 8.2)
  minimum: "A C17 compiler on a 64-bit platform; bdwgc 8.x built with POSIX threads"
  build: "sh run.sh (cc -std=c17 with -lgc -lpthread)"
  native: "OpenSSL 3 (libcrypto) for crypto, libcurl and zlib for HTTP (gzip responses are decoded with zlib), and the Boehm-Demers-Weiser collector (bdwgc 8.x) built with POSIX threads. IEEE CRC32 uses a slicing-by-8 fallback because standard C provides no CRC API."
representations:
  - {type: type.float, contract_version: 1.0.0, representation: "GX_FLOAT tagged gx_V containing double; volatile operation results enforce the declared IEEE width."}
  - {type: type.boolean, contract_version: 1.0.0, representation: "gx_V tagged GX_BOOL."}
  - {type: type.integer, contract_version: 1.0.0, representation: "gx_V holding an int64_t normalized to the Go width after every operation; arithmetic wraps through uint64_t, so no signed overflow occurs; unsigned 64-bit values keep their bits (types/gx.h)."}
  - {type: type.string, contract_version: 1.0.0, representation: "gx_V with a pointer to immutable bytes and a length; substrings share bytes."}
  - {type: type.array, contract_version: 1.0.0, representation: "Native uint8_t arrays for underlying byte/uint8 elements, otherwise collected gx_V arrays; generated zero, clone, in-place set, equality and key helpers preserve value semantics."}
  - {type: type.struct, contract_version: 1.0.0, representation: "A collected gx_V array of fields with generated helpers; storage objects are updated in place, so field pointers stay valid."}
  - {type: type.slice, contract_version: 1.0.0, representation: "gx_V slice headers (first element, length, capacity) over collector-owned backing; pad=1 hints native pointer-free uint8_t payloads, including typed nil. Other elements use gx_V arrays; NULL means nil."}
  - {type: type.map, contract_version: 1.0.0, representation: "gx_Map: an open-addressing index from encoded keys to insertion-ordered entries (types/map.c); nil is GX_NIL."}
  - {type: type.pointer, contract_version: 1.0.0, representation: "Pointers to structs and arrays are the storage objects; other pointers point at a gx_V slot in a cell or struct; nil is GX_NIL."}
  - {type: type.interface, contract_version: 1.0.0, representation: "GX_NIL or a collected gx_Box (static gx_TypeDesc, value) with equality, key encoding, and method tables (types/func.c)."}
  - {type: type.function, contract_version: 1.0.0, representation: "Collected gx_Func objects: a code pointer, a captured environment, and a recover identity; nil is GX_NIL."}
  - {type: type.error, contract_version: 1.0.0, representation: "Interface boxes; runtime errors use the GX_RUNTIME_ERROR, GX_PLAIN_ERROR, and GX_TYPE_ASSERTION_ERROR descriptors (types/panic.c). Panics longjmp to the innermost handler."}
  - {type: type.channel, contract_version: 1.0.0, representation: "Collected gx_Chan objects with a ring buffer and FIFO wait queues; nil is GX_NIL."}
  - {type: type.task, contract_version: 1.0.0, representation: "A stack of collected resumable frames per owner task, driven by the virtual trampoline or explicit serialized monotonic executable host entry (runtime/task_spawn.c); native wire mailboxes retain only numeric identities and independently released bytes."}
harness:
  support: [tests/harness/main.c, tests/harness/json.c, tests/harness/json.h, tests/harness/codec.c, tests/harness/codec.h, tests/harness/run.sh]
  generated: tests/harness/harness_gen.c
  command: [sh, targets/c/tests/harness/run.sh]
support_files: [types/float.c, types/native.h, types/library.c, types/library.h, types/bounds.c, types/func.c, types/gx.h, types/ints.c, types/map.c, types/panic.c, types/program.c, types/sched.c, types/utf8.c, types/value.c, types/log.c]
