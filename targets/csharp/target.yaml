schema_version: 1
target: csharp
version: 0.1.0
status: experimental
environment:
  runtime: .NET 8
  minimum: ".NET 8 SDK (C# 12)"
  build: "sh run.sh (csc from the .NET 8 SDK), or dotnet run with main.csproj"
  native: ".NET 8 built-ins for crypto (System.Security.Cryptography) and HTTP (HttpClient); IEEE CRC32 uses the official Microsoft System.IO.Hashing 8.0.0 NuGet package with a content-hash lock, not the shared runtime. Host runtime controls acceleration."
representations:
  - {type: type.float, contract_version: 1.0.0, representation: "Native float/double with explicit key normalization and numeric conversions."}
  - {type: type.boolean, contract_version: 1.0.0, representation: C# bool.}
  - {type: type.integer, contract_version: 1.0.0, representation: "C# long for every integer kind, normalized to the Go width after every operation; unsigned 64-bit values keep their bits and use unsigned comparison, division, and formatting (types/Ints.cs)."}
  - {type: type.string, contract_version: 1.0.0, representation: "C# string holding one char per byte (Latin-1), so indexing and length are bytewise."}
  - {type: type.array, contract_version: 1.0.0, representation: "object[] with generated zero, clone, in-place set, equality, and key helpers per array type."}
  - {type: type.struct, contract_version: 1.0.0, representation: "One generated class per struct type with _clone, _set, _eq, and _key; storage objects are updated in place, so field pointers stay valid."}
  - {type: type.slice, contract_version: 1.0.0, representation: "Immutable Slice headers (a, o, l, c) over shared object[] arrays (types/Slice.cs); Slice.NIL is the nil slice."}
  - {type: type.map, contract_version: 1.0.0, representation: "GoMap: a Dictionary from encoded keys to entries plus an insertion-ordered entry list (types/GoMap.cs); nil is null."}
  - {type: type.pointer, contract_version: 1.0.0, representation: "Pointers to structs and arrays are the objects themselves; other pointers are Cell or canonical FieldRef objects (types/Ref.cs); nil is null."}
  - {type: type.interface, contract_version: 1.0.0, representation: "null or a Box (t, v) with per-type equality, key encoding, and method tables (types/Box.cs, types/TypeDesc.cs)."}
  - {type: type.function, contract_version: 1.0.0, representation: "Fn objects wrapping a delegate over boxed arguments, tagged with an identity for recover; nil is null."}
  - {type: type.error, contract_version: 1.0.0, representation: "Interface Boxes; runtime errors use the RUNTIME_ERROR, PLAIN_ERROR, and TYPE_ASSERTION_ERROR descriptors (types/Panics.cs)."}
  - {type: type.channel, contract_version: 1.0.0, representation: "Chan objects with a buffer and FIFO wait queues (runtime/ChanMake.cs); null is the nil channel."}
  - {type: type.task, contract_version: 1.0.0, representation: "A stack of resumable frames per task driven by a trampoline (runtime/TaskSpawn.cs): suspending functions compile to Frame subclasses with a step method; exactly one task runs at a time, dispatched FIFO."}
harness:
  support: [tests/harness/Harness.cs, tests/harness/Codec.cs, tests/harness/run.sh]
  generated: tests/harness/HarnessGen.cs
  command: [sh, targets/csharp/tests/harness/run.sh]
support_files: [types/Floats.cs, types/Bounds.cs, types/Box.cs, types/Fn.cs, types/GoMap.cs, types/GoPanic.cs, types/Ints.cs, types/KeyList.cs, types/Out.cs, types/Panics.cs, types/Program.cs, types/Ref.cs, types/Slice.cs, types/TypeDesc.cs, types/Usings.cs, types/Utf8.cs, types/Native.cs, types/Crypto.cs, types/Callback.cs, types/Log.cs, runtime/Library.cs, runtime/TaskSpawn.cs, runtime/StdContextErr.cs, runtime/StdContextWithCancel.cs, runtime/ChanMake.cs, runtime/ChanClose.cs, runtime/StdErrorsNew.cs]
