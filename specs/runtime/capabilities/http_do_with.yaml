  "behavior": {
    "zero": "Zero key handles are invalid. Empty byte inputs are permitted unless an operation requires a fixed size.",
    "nil": "Nil byte slices are empty. Nil keys/HTTP contexts return an error; Close accepts nil.",
    "bounds": "GET/POST only; GET has empty body. URL<=8192 bytes, request/reply body<=64MiB, header bytes<=64KiB, timeoutMillis=1..300000. Header input alternates name/value; odd length, invalid tokens, control bytes and framing/hop/proxy headers are rejected. Options alternate name/value with total name and value bytes <=1MiB; names are client-cert, client-key, root-cas and insecure-skip-verify, each at most once; client-cert and client-key come together; insecure-skip-verify is \"true\" or \"false\". Odd length, unknown or repeated names and other values are invalid requests.",
    "conversions": "Not applicable.",
    "overflow": "Not applicable.",
    "mutations": "Input bytes and header slices are not mutated. Close invalidates aliases of its key.",
    "aliasing": "Outputs are independently owned. Keys are aliased opaque handles; Close prevents new acquisitions. In-flight operations may retain key snapshots through completion.",
    "allocation": "Native buffers are host-managed. No guaranteed private-material erasure. Future async adapters retain inputs/keys until completion and do not borrow mutable host buffers.",
    "errors": "Transport, context cancellation/deadline and limit failures return zero status/nil headers/nil body and error. Non-2xx and redirects return ordinary responses. Certificates, keys or root CAs that do not parse, or a key that does not match its certificate, return \"http: invalid TLS option\" where the host checks them before connecting; otherwise the handshake fails as a transport error. Hosts that cannot honour options (browsers) return an unsupported error for any option.",
    "panics": "No deliberate panic on invalid input. Host allocation failures remain host failures.",
    "observations": "Real timeoutMillis and earlier parent deadline bound request. Native std context cancellation is propagated. No redirects, normal trusted TLS verification, host-configured proxy. Automatic gzip follows the Go stdlib transport: Accept-Encoding: gzip is sent unless the first Accept-Encoding or Range header has a non-empty value, in which case response bytes are returned as received; a response whose first Content-Encoding is gzip is decoded unless it has no body (Content-Length 0, 204, 304 or 1xx), in which case its headers are kept; concatenated gzip members are decoded; truncated or corrupt streams are transport errors; the body limit applies to decoded bytes; decoded Content-Encoding/Length headers are removed. Browser fetch decodes compression itself: browsers reject a caller Accept-Encoding with an unsupported error and may not report truncated or multi-member gzip like Go. Response header names sorted/canonicalized; duplicate values retain server order; wire inter-name order is not retained. Options apply to https URLs. Server certificates are verified against the system roots plus root-cas, with host name checks, unless insecure-skip-verify is \"true\"; rejection is the default. The client certificate (PEM chain) and unencrypted PEM private key (PKCS#8, PKCS#1 or SEC1) are offered when the server requests one."
  },
